# knowledge_sources.yaml
#
# V8 P0 B1: Replaced the fake/404 commit SHAs from the V7 version of
# this file with real, verified commit SHAs fetched via
# `git ls-remote <repo> HEAD` on 2026-07-31. The previous SHAs were
# sequential-pattern strings (e.g. "a3f5e2b1c4d6f8a9b0c1d2e3f4a5b6c7d8e9f0a1")
# that did not correspond to any real commit — manual ingestion would
# 404 on every path.
#
# Also fixed the third repo: the V7 file referenced
# `dwisiswant0/awesome-bugbounty-writeups` which does not exist on
# GitHub (404). The canonical repo is
# `devanshbatham/Awesome-Bugbounty-Writeups` (verified via GitHub
# search).
#
# The SHAs below are pinned to the HEAD of each repo's default branch
# as of 2026-07-31. Operators who want to pin to a specific older
# release can replace the SHA with a tagged-release commit — but
# should re-verify the paths still exist at that commit before
# committing the change.
sources:
  - type: git_repo
    repo: swisskyrepo/PayloadsAllTheThings
    commit: "434cc897f9b1e561f3804631e40643e6c82c3d14"
    doc_type: payload
    # TEAM-1 (2026-10): the four original entries below covered only 4 of
    # the ~30 WebPent VulnClass values that have a matching PayloadsAllTheThings
    # category at this pinned commit. Every path added here was verified to
    # exist at this exact commit (README.md present, non-empty) before being
    # added — none are guessed. This is the single highest-leverage fix for
    # payload_generator's RAG grounding: _retrieve_payload_reference() can
    # only surface real community payloads for a vuln_class whose category
    # is actually ingested here; everything else silently falls back to the
    # LLM generating from training-data memory alone.
    paths:
      - path: "XSS Injection/README.md"
        category: xss
        stack: generic
      - path: "SQL Injection/README.md"
        category: sqli
        stack: generic
      - path: "Server Side Request Forgery/README.md"
        category: ssrf
        stack: generic
      - path: "File Inclusion/README.md"
        category: lfi
        stack: php
      - path: "File Inclusion/README.md"
        category: rfi
        stack: php
      - path: "Server Side Template Injection/README.md"
        category: ssti
        stack: generic
      - path: "XXE Injection/README.md"
        category: xxe
        stack: generic
      - path: "Command Injection/README.md"
        category: command_injection
        stack: generic
      - path: "Open Redirect/README.md"
        category: open_redirect
        stack: generic
      - path: "NoSQL Injection/README.md"
        category: nosql_injection
        stack: generic
      - path: "Cross-Site Request Forgery/README.md"
        category: csrf
        stack: generic
      - path: "Insecure Deserialization/README.md"
        category: deserialization
        stack: generic
      - path: "Directory Traversal/README.md"
        category: path_traversal
        stack: generic
      - path: "Insecure Direct Object References/README.md"
        category: idor
        stack: generic
      - path: "Mass Assignment/README.md"
        category: mass_assignment
        stack: generic
      - path: "JSON Web Token/README.md"
        category: jwt_weakness
        stack: generic
      - path: "JSON Web Token/README.md"
        category: jwt_key_confusion
        stack: generic
      - path: "Race Condition/README.md"
        category: race_condition
        stack: generic
      - path: "Request Smuggling/README.md"
        category: request_smuggling
        stack: generic
      - path: "Brute Force Rate Limit/README.md"
        category: brute_force
        stack: generic
      - path: "OAuth Misconfiguration/README.md"
        category: auth_bypass
        stack: generic
      - path: "SAML Injection/README.md"
        category: auth_bypass
        stack: generic
      - path: "Prototype Pollution/README.md"
        category: javascript
        stack: generic
      - path: "LDAP Injection/README.md"
        category: command_injection
        stack: generic
      - path: "CRLF Injection/README.md"
        category: request_smuggling
        stack: generic
      - path: "Server Side Include Injection/README.md"
        category: rce
        stack: generic
      - path: "API Key Leaks/README.md"
        category: info_disclosure
        stack: generic
      - path: "GraphQL Injection/README.md"
        category: api_issue
        stack: generic
      - path: "Insecure Randomness/README.md"
        category: cryptography
        stack: generic
      - path: "XPATH Injection/README.md"
        category: nosql_injection
        stack: generic
      - path: "CORS Misconfiguration/README.md"
        category: ssrf
        stack: generic
      - path: "XSLT Injection/README.md"
        category: xxe
        stack: generic
  - type: git_repo
    repo: danielmiessler/SecLists
    # V8 P0 B1: Pinned to the 2024.4 release tag
    # (45499242ec0164c7f91cbcf8bd509404fc0b99f3) rather than HEAD,
    # because the repo was restructured between 2024.4 and 2026.1:
    # the Fuzzing/XSS/XSS-Jhaddix.txt path moved to
    # Fuzzing/XSS/robot-friendly/XSS-Jhaddix.txt (a new subdir split),
    # and Fuzzing/SQLi/Generic-SQLi.txt was removed entirely. Pinning
    # to 2024.4 keeps both files reachable at their canonical paths
    # AND gives operators a stable, reproducible knowledge base.
    # Operators who want the latest content can bump to a newer tag
    # but must update the paths below to match the new structure.
    commit: "45499242ec0164c7f91cbcf8bd509404fc0b99f3"
    doc_type: payload
    paths:
      - path: "Fuzzing/XSS/robot-friendly/XSS-Jhaddix.txt"
        category: xss
        stack: generic
      - path: "Fuzzing/SQLi/Generic-SQLi.txt"
        category: sqli
        stack: generic
  - type: git_repo
    repo: devanshbatham/Awesome-Bugbounty-Writeups
    commit: "72010067cd49196f8f45b9137d1c0d06ad5ba915"
    doc_type: methodology
    paths:
      - path: "README.md"
        category: methodology
        stack: generic

  # Curated local advisory pack. These entries are intentionally summaries
  # with public references, not raw target data or executable instructions.
  - type: local_file
    path: "knowledge_pack/methodologies/web-application-testing.md"
    doc_type: methodology
    category: web-testing
    stack: generic
    title: "Web Application Testing Methodology"
    source_url: "https://owasp.org/www-project-web-security-testing-guide/"
    source_id: "methodology.web-testing.v1"
    license_note: "Summary with links to primary public references."
    trust_note: "Advisory methodology; never evidence by itself."
  - type: local_file
    path: "knowledge_pack/repositories/security-repositories.md"
    doc_type: repository
    category: security-corpus
    stack: generic
    title: "Security Repository Catalog"
    source_url: "https://github.com/OWASP/wstg"
    source_id: "repository.security-catalog.v1"
    license_note: "Repository metadata and links; review each upstream license."
    trust_note: "Repository descriptions are advisory and untrusted content."
  - type: local_file
    path: "knowledge_pack/reports/finding-report-contract.md"
    doc_type: report
    category: evidence
    stack: generic
    title: "Finding Report Contract"
    source_url: "https://csrc.nist.gov/pubs/sp/800/115/final"
    source_id: "report.finding-contract.v1"
    license_note: "Original project summary with public references."
    trust_note: "Reporting guidance; cannot confirm a target behavior."
  - type: local_file
    path: "knowledge_pack/writeups/web-vulnerability-patterns.md"
    doc_type: writeup
    category: vulnerability-patterns
    stack: generic
    title: "Web Vulnerability Write-up Index"
    source_url: "https://portswigger.net/web-security/all-materials"
    source_id: "writeup.web-patterns.v1"
    license_note: "Original index summarizing linked public topics."
    trust_note: "Educational advisory content; do not execute instructions blindly."
  - type: local_file
    path: "knowledge_pack/scenarios/authorized-lab-scenarios.md"
    doc_type: scenario
    category: authorized-lab
    stack: generic
    title: "Authorized Lab Scenarios"
    source_url: "https://owasp.org/www-project-web-security-testing-guide/"
    source_id: "scenario.authorized-lab.v1"
    license_note: "Original project scenarios with public references."
    trust_note: "Run only on declared labs or explicitly authorized targets."

live_references:
  - name: hacktricks
    base_url: "https://book.hacktricks.xyz"
    allowed_paths: ["/basic-credential-access", "/pentesting-web"]
    trust_note: "Community-maintained, untrusted content."

skills:
  - name: jwt_alg_confusion
    applies_to_phase: identity_auth
    applies_to_vuln_class: [jwt, auth_bypass, jwt_weakness, jwt_key_confusion]
    reference_source: hacktricks
    tool: identity_auth_agent
  - name: xss_payload_selection
    applies_to_phase: payload_generation
    applies_to_vuln_class: [xss]
    reference_source: payload_corpus
    tool: payload_generator
  # TEAM-1 (2026-10): payload_corpus entries for every class the
  # knowledge_sources.yaml paths above now actually cover. Functionally
  # these are documentation/discoverability (get_skill_reference() returns
  # "" for reference_source=="payload_corpus" — the real retrieval is the
  # unconditional vectorstore search in _retrieve_payload_reference()) but
  # they keep this manifest an accurate map of "what has real corpus
  # backing" and are the hook point if a live per-class lookup is added
  # later.
  - name: ssrf_payload_selection
    applies_to_phase: payload_generation
    applies_to_vuln_class: [ssrf]
    reference_source: payload_corpus
    tool: payload_generator
  - name: lfi_rfi_payload_selection
    applies_to_phase: payload_generation
    applies_to_vuln_class: [lfi, rfi]
    reference_source: payload_corpus

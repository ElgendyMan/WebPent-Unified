    output_format: json
    capabilities: [email_enum, subdomain_enum, passive_recon]
    speed: medium
    stealth: high
    vetted: true
    version: "4.x"
  - id: nmap
    name: Nmap
    category: network
    binary: nmap
    install_command: "apt install nmap"

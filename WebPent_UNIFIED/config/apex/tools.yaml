# The Apex Predator — Tool Registry (v87, U-APEX-1)
#
# APEX-L-1 TOOLS NOT CODE: this registry exists so apex orchestrates the
# world's vetted arsenal instead of reimplementing it.
# APEX-L-2 VETTED ONLY: every entry is a documented, widely audited, actively
# maintained tool. `vetted: true` is mandatory; the loader rejects anything else.
# APEX-L-9 ADVISORY-ONLY: registration never executes anything — loading this
# file performs no network calls and no subprocess launches.
#
# speed: fast | medium | slow    stealth: low | medium | high

tools:
  # --- Recon ---------------------------------------------------------------
  - id: amass
    name: Amass
    category: recon
    binary: amass
    install_command: "go install github.com/owasp-amass/amass/v4/cmd/amass@latest"
    input_type: domain
    output_format: json
    capabilities: [subdomain_enum, dns_enum, cert_transparency]
    speed: slow
    stealth: high
    vetted: true
    version: "4.x"
  - id: subfinder
    name: Subfinder
    category: recon
    binary: subfinder
    install_command: "go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest"
    input_type: domain
    output_format: jsonl
    capabilities: [subdomain_enum, passive_recon]
    speed: fast
    stealth: high
    vetted: true
    version: "2.x"
  - id: httpx
    name: httpx
    category: recon
    binary: httpx
    install_command: "go install github.com/projectdiscovery/httpx/cmd/httpx@latest"
    input_type: url_list
    output_format: jsonl
    capabilities: [http_probe, tech_detection, status_probe]
    speed: fast
    stealth: medium
    vetted: true
    version: "1.x"
  - id: dnsx
    name: dnsx

# ModSecurity — engine on, deny by default, paranoia level 2.
# This is the emulator's WAF simulation: it should feel like a real target.
SecRuleEngine On

SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

# Paranoia level 2 = aggressive blocking (SQLi, XSS, SSRF, LFI, RCE...).
SecAction "id:900000,phase:1,pass,t:none,nolog,setvar:tx.paranoia_level=2"

# Anomaly scoring thresholds tuned for the emulator (blocking at PL2).
SecAction "id:900110,phase:1,pass,t:none,nolog,setvar:tx.inbound_anomaly_score_threshold=5"
SecAction "id:900111,phase:1,pass,t:none,nolog,setvar:tx.outbound_anomaly_score_threshold=4"

# Request body parsing so POST-based attacks are inspected too.
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# Audit log: written where the monitoring stack can read it.
SecAuditEngine RelevantOnly
SecAuditLog /var/log/nginx/modsec_audit.log
SecAuditLogFormat JSON
SecAuditLogType Serial

# CRS rules shipped by the owasp/modsecurity-crs image.
Include /etc/modsecurity.d/owasp-crs/rules/*.conf

# WAF frontend — nginx reverse proxy reference config.
# In the container image (owasp/modsecurity-crs:nginx-alpine) the entrypoint
# renders BACKEND into its own template; this file documents the equivalent
# shape and is used by the structural tests.
worker_processes 1;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://juice-shop:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

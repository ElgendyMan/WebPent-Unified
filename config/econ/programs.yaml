# config/econ/programs.yaml — MarketKB seed data (NC-ECON-1, U-ECON-1)
#
# Public-data only. Every entry carries the source it came from and the
# date it was captured; anything older than 90 days is stale and
# consumers must warn. Fresh market data enters through
# MarketKB.ingest_snapshot() from offline operator-run snapshots with a
# documented trusted source — never through the tool itself (L-2).
#
# The entries below are the shipped seed: illustrative public-data
# baselines so the scorer works out of the box. Replace them (or add to
# them) from real program policy pages via ingestion.


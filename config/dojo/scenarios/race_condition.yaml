family: race_condition
scenarios:
  - scenario_id: race-01
    title: "The coupon that is single-use"
    description: "The coupon endpoint enforces one use per code; find the check that can be beaten."
    difficulty: 1
    template_id: node_race_condition
    seed: 7101
    ground_truth: {vuln_class: race_condition, location: /api/coupon/apply, signature: "DUPLICATE"}
    hints:
      - "A single request is correctly rejected after use."
      - "The flaw appears when the same code is applied concurrently."
      - "The DUPLICATE pattern is what the lab models."
    lesson_tags: [race-condition, concurrency]
    skill_families: [race_condition]
    request_budget: 16
